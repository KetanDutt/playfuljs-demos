<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050612"><meta name="description" content="An interactive luminous particle field."><title>Gravity Field — Playful.js</title>
<link rel="stylesheet" href="../demo.css"></head>
<body><canvas id="display" aria-label="Interactive particle field"></canvas><div class="ui"><div class="buttons"><a href="../" aria-label="Back to gallery">←</a><button id="toggle" type="button" aria-label="Pause animation">Pause</button></div><h1>Gravity Field</h1><p><span class="badge">Particle simulation</span> · Follow your pointer</p></div><div class="tip">Press and hold to repel · Double-click to scatter</div>
<script>
'use strict';
const canvas=document.getElementById('display'),ctx=canvas.getContext('2d',{alpha:false});let w,h,dpr,particles=[],pointer={x:0,y:0,down:false,active:false},last=0,running=true;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!pointer.active){pointer.x=w/2;pointer.y=h/2}if(!particles.length)for(let i=0;i<Math.min(420,Math.max(180,w*h/3500));i++){let x=Math.random()*w,y=Math.random()*h;particles.push({x,y,px:x,py:y});}}
function locate(e){const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;pointer.active=true}
canvas.addEventListener('pointermove',locate,{passive:true});canvas.addEventListener('pointerdown',e=>{locate(e);pointer.down=true;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>pointer.down=false);canvas.addEventListener('pointercancel',()=>pointer.down=false);canvas.addEventListener('dblclick',()=>particles.forEach(p=>{p.px=p.x+(Math.random()-.5)*60;p.py=p.y+(Math.random()-.5)*60}));addEventListener('resize',resize);resize();
document.getElementById('toggle').addEventListener('click',function(){running=!running;this.textContent=running?'Pause':'Resume';this.setAttribute('aria-label',running?'Pause animation':'Resume animation');last=0});
function frame(t){requestAnimationFrame(frame);if(document.hidden||!running){last=0;return}const dt=Math.min(2,(t-last)/16.67||1);last=t;ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(5,6,18,.18)';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='lighter';for(const p of particles){let vx=(p.x-p.px)*.985,vy=(p.y-p.py)*.985,dx=pointer.x-p.x,dy=pointer.y-p.y,dist=Math.hypot(dx,dy)||1,force=(pointer.down?-5.2:1.05)*dt;p.px=p.x;p.py=p.y;p.x+=vx+(dx/dist)*force;p.y+=vy+(dy/dist)*force;if(p.x<-30||p.x>w+30||p.y<-30||p.y>h+30){p.x=Math.max(0,Math.min(w,p.x));p.y=Math.max(0,Math.min(h,p.y));p.px=p.x;p.py=p.y}const speed=Math.min(20,Math.hypot(vx,vy));ctx.strokeStyle=`hsla(${205+speed*6},100%,68%,${.3+speed/30})`;ctx.lineWidth=1.2+speed/10;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke()}}
requestAnimationFrame(frame);
</script></body></html>
