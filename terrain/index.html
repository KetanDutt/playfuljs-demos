<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100f"><meta name="description" content="Procedurally generated isometric terrain."><title>Terrain — Playful.js</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100f;color:#fff;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%}.ui{position:fixed;top:max(18px,env(safe-area-inset-top));left:18px}.buttons{display:flex;gap:8px}.ui a,.ui button{height:40px;border:1px solid #ffffff30;background:#0a1715bb;color:#fff;border-radius:99px;padding:0 15px;text-decoration:none;display:inline-flex;align-items:center;backdrop-filter:blur(8px);cursor:pointer}.ui a{width:40px;padding:0;justify-content:center;border-radius:50%}h1{font-size:clamp(1.6rem,5vw,3rem);letter-spacing:-.05em;margin:22px 0 3px}.ui p{margin:0;color:#abc0ba;font-size:.8rem}.badge{color:#78f6d2;font:800 .67rem ui-monospace;letter-spacing:.15em}</style></head><body><canvas id="display" aria-label="Procedural isometric island"></canvas><div class="ui"><div class="buttons"><a href="../" aria-label="Back to gallery">←</a><button id="generate">New island</button></div><h1>Terrain</h1><p><span class="badge">DIAMOND–SQUARE</span> · A new world every time</p></div><script>
'use strict';const canvas=document.getElementById('display'),ctx=canvas.getContext('2d',{alpha:false});let w,h,dpr,map,size=65,max=size-1,phase=0,lastDraw=0;
function at(x,y){return x<0||y<0||x>max||y>max?null:map[x+y*size]}function set(x,y,v){map[x+y*size]=v}
function generate(){map=new Float32Array(size*size);set(0,0,max*.7);set(max,0,max*.35);set(max,max,max*.15);set(0,max,max*.45);for(let step=max;step>1;step/=2){const half=step/2,scale=step*.72;for(let y=half;y<max;y+=step)for(let x=half;x<max;x+=step){set(x,y,(at(x-half,y-half)+at(x+half,y-half)+at(x-half,y+half)+at(x+half,y+half))/4+(Math.random()*2-1)*scale)}for(let y=0;y<=max;y+=half)for(let x=(y+half)%step;x<=max;x+=step){const vals=[at(x,y-half),at(x+half,y),at(x,y+half),at(x-half,y)].filter(v=>v!==null);set(x,y,vals.reduce((a,b)=>a+b,0)/vals.length+(Math.random()*2-1)*scale)}}phase+=1}
function resize(){dpr=Math.min(devicePixelRatio||1,1.6);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw(performance.now())}addEventListener('resize',resize);document.getElementById('generate').onclick=()=>{generate();draw(performance.now())};
function draw(t){lastDraw=t;ctx.fillStyle='#07100f';ctx.fillRect(0,0,w,h);const scale=Math.min(w/85,h/55),ox=w*.5+Math.sin(t/5000+phase)*w*.025,oy=h*.13,water=max*.27;for(let y=0;y<max;y++)for(let x=0;x<max;x++){const v=at(x,y),slope=at(x+1,y)-v,px=ox+(x-y)*scale*.62,base=oy+(x+y)*scale*.31,py=base-v*scale*.52;let light=Math.max(35,Math.min(85,58+slope*3));ctx.fillStyle=v<water?`hsl(42 55% ${light}%)`:v>max*.69?`hsl(170 14% ${Math.min(92,light+20)}%)`:`hsl(${125+v*.18} 35% ${light*.68}%)`;ctx.fillRect(px,py,Math.ceil(scale*.7),Math.max(1,base-py));if(v<water){const wy=base-water*scale*.52;ctx.fillStyle='rgba(45,174,190,.2)';ctx.fillRect(px,wy,Math.ceil(scale*.7),Math.max(1,base-wy))}}ctx.fillStyle='rgba(120,246,210,.7)';ctx.fillRect(0,h-2,w,2)}generate();resize();
</script></body></html>
