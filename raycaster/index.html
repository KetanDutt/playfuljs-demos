<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="Escape a procedurally generated raycast maze.">
  <title>Maze Runner — Playful.js</title>
  <link rel="stylesheet" href="css/frame.css">
</head>
<body>
  <canvas id="display" aria-label="Maze Runner game view">Your browser needs Canvas support.</canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="crosshair" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <button class="icon-button home" type="button" onclick="location.href='../'" aria-label="Back to demo gallery">←</button>
  <button id="mute" class="icon-button mute" type="button" aria-label="Toggle sound">♪</button>
  <button id="help" class="icon-button help" type="button" aria-label="Show controls">?</button>

  <section class="modal show" id="instructions" aria-labelledby="game-title">
    <div class="modal-card">
      <p class="eyebrow">Procedural raycast survival</p>
      <h1 id="game-title">Maze Runner</h1>
      <p>Find the golden beacon. Keep moving—the maze has company.</p>
      <div class="controls-grid">
        <div><kbd>WASD</kbd><span>Move & turn</span></div><div><kbd>Shift</kbd><span>Sprint</span></div>
        <div><kbd>Click</kbd><span>Attack</span></div><div><kbd>I</kbd><span>Switch weapon</span></div>
        <div><kbd>F</kbd><span>Mouse look</span></div><div><kbd>Esc</kbd><span>Pause</span></div>
      </div>
      <button id="play" class="primary" type="button">Enter the maze</button>
      <p class="hint">Headphones recommended · Sound starts after interaction</p>
    </div>
  </section>

  <div class="mobile-controls" aria-label="Touch controls">
    <div class="dpad"><button data-control="forward" aria-label="Move forward">▲</button><button data-control="left" aria-label="Turn left">◀</button><button data-control="backward" aria-label="Move backward">▼</button><button data-control="right" aria-label="Turn right">▶</button></div>
    <button class="attack" data-action="attack" aria-label="Attack">✦</button>
  </div>

  <script src="js/pointerlock.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
