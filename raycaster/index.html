<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raycaster Demo</title>
    <link rel="stylesheet" href="css/frame.css">
  </head>
  <body>
      <div class="instructions" id="instructions">
        <strong>Instructions</strong>
        <ul>
          <li>Use W, A, S, D or arrow keys to move</li>
          <li>Press <strong>F</strong> for fullscreen mode (Esc to exit)</li>
          <li>Hold down <strong>Shift</strong> to run</li>
          <li>Press <strong>I</strong> to cycle weapons</li>
          <li><strong>Left Click</strong> to attack</li>
        </ul>
        <button onclick="toggleInstructions();">Hide Instructions</button>
      </div>
      <canvas id='display' width='1' height='1'></canvas>

    <script src="js/pointerlock.js"> </script>
    <script src="js/game.js"> </script>
  </body>
</html>
