<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03070c"><meta name="description" content="A colorful Verlet particle fountain."><title>Particle Fountain — Playful.js</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070c;color:#fff;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:max(18px,env(safe-area-inset-top)) auto auto 18px;pointer-events:none}.ui a,.ui button{pointer-events:auto;border:1px solid #ffffff30;background:#08111aaa;color:#fff;border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;text-decoration:none;backdrop-filter:blur(8px);cursor:pointer}.ui button{margin-left:7px}h1{font-size:clamp(1.6rem,5vw,3rem);letter-spacing:-.05em;margin:22px 0 3px}.ui p{margin:0;color:#9eb2c3;font-size:.8rem}.badge{color:#62bfff;font:800 .67rem ui-monospace;letter-spacing:.15em}</style></head><body><canvas id="display" aria-label="Particle fountain"></canvas><div class="ui"><a href="../" aria-label="Back to gallery">←</a><button id="toggle" aria-label="Pause animation">Ⅱ</button><h1>Fountain</h1><p><span class="badge">VERLET PHYSICS</span> · Tap anywhere to move the source</p></div><script>
'use strict';const canvas=document.getElementById('display'),ctx=canvas.getContext('2d',{alpha:false});let w,h,dpr,last=0,running=true,source={x:0,y:0},drops=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);source.x=source.x||w/2;source.y=h-4}addEventListener('resize',resize);resize();
canvas.addEventListener('pointerdown',e=>{source.x=e.clientX;source.y=e.clientY;for(let i=0;i<30;i++)emit()});document.getElementById('toggle').onclick=e=>{running=!running;e.currentTarget.textContent=running?'Ⅱ':'▶';e.currentTarget.setAttribute('aria-label',running?'Pause animation':'Resume animation')};
function emit(){if(drops.length>=650)drops.shift();const p={x:source.x+(Math.random()-.5)*8,y:source.y,px:source.x+(Math.random()-.5)*5,py:source.y+Math.random()*18+10,life:1};drops.push(p)}
function frame(t){requestAnimationFrame(frame);const dt=Math.min(2,(t-last)/16.67||1);last=t;if(!running||document.hidden)return;ctx.fillStyle='rgba(3,7,12,.2)';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='lighter';for(let j=0;j<Math.ceil(4*dt);j++)emit();for(let i=drops.length-1;i>=0;i--){const p=drops[i],vx=(p.x-p.px)*.998,vy=(p.y-p.py)*.998;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+.28*dt*dt;if(p.y>h){p.y=h;p.py=h+vy*.42;p.life-=.025}if(p.x<0||p.x>w){p.x=Math.max(0,Math.min(w,p.x));p.px=p.x+vx*.5}const speed=Math.hypot(vx,vy);ctx.strokeStyle=`hsla(${185+Math.min(110,speed*7)},100%,65%,${Math.max(.12,p.life)})`;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();if(p.life<=0)drops.splice(i,1)}ctx.globalCompositeOperation='source-over'}requestAnimationFrame(frame);
</script></body></html>
